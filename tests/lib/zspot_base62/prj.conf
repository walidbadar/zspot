CONFIG_ZTEST=y

# The protocol core is C++ with the standard library and exceptions
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y

# Utils.cpp swaps byte order with the network stack's helpers
CONFIG_NETWORKING=y
CONFIG_NET_LOOPBACK=y
