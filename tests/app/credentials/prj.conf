CONFIG_ZTEST=y

# Settings in NVS on the simulated flash, as on the ESP32-S3
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# The credentials go through the secure storage: AES-GCM with a key derived
# from the device ID, stored in the settings
CONFIG_SECURE_STORAGE=y
CONFIG_SECURE_STORAGE_ITS_MAX_DATA_SIZE=1024
CONFIG_ENTROPY_GENERATOR=y
# An entry passes through buffers of its size on the stack
CONFIG_ZTEST_STACK_SIZE=8192
