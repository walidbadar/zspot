CONFIG_ZTEST=y
CONFIG_BASE64=y
# The stack of the request thread comes from it here
CONFIG_HEAP_MEM_POOL_SIZE=32768

# The credentials are kept in the secure storage: AES-GCM with a key derived
# from the device ID, stored in the settings in NVS on the simulated flash
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SECURE_STORAGE=y
CONFIG_SECURE_STORAGE_ITS_MAX_DATA_SIZE=1024
CONFIG_ENTROPY_GENERATOR=y
# An entry passes through buffers of its size on the stack
CONFIG_ZTEST_STACK_SIZE=8192
