#
# West manifest: "west init -m <this repo> && west update" creates a workspace
# with Zephyr and only the modules zspot needs. The repository itself is a
# Zephyr module (zephyr/module.yml) and is picked up automatically.

manifest:
  self:
    path: zspot

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      # main after v4.5.0 (v4.5.0-2533-g073e47854ed), with the ALSA backend
      # of the native_sim I2S driver
      revision: 073e47854ede6baf45acf49aa5439cafd2a7bbf9
      import:
        # Only the modules the library and the player application need
        name-allowlist:
          - cmsis_6
          - hal_espressif
          - lvgl
          - mbedtls
          - tf-psa-crypto
          - nanopb
          - picolibc
