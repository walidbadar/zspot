#
# West manifest: "west init -m <this repo> && west update" creates a workspace
# with Zephyr and only the modules zspot needs. The repository itself is a
# Zephyr module (zephyr/module.yml) and is picked up automatically.

manifest:
  self:
    path: zspot

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      # main after v4.5.0 (v4.5.0-962-g0534e997eac)
      revision: 0534e997eacb94bae1df6c9a7dd4a9a6cbf1cecf
      import:
        # Only the modules the library and the player application need
        name-allowlist:
          - cmsis_6
          - hal_espressif
          - lvgl
          - mbedtls
          - tf-psa-crypto
          - nanopb
          - picolibc
