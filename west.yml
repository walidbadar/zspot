#
# West manifest: "west init -m <this repo> && west update" creates a workspace
# with Zephyr and only the modules zspot needs. The repository itself is a
# Zephyr module (zephyr/module.yml) and is picked up automatically.

manifest:
  self:
    path: zspot

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    # Projects listed here override the definitions imported from zephyr.
    # The Espressif HAL is kept at the revision this project was verified
    # with (newer than Zephyr's pin at the time).
    - name: hal_espressif
      remote: zephyrproject-rtos
      revision: 0bd7ba4cdeb218fad291ae06f728c335a97e588d
      path: modules/hal/espressif

    - name: zephyr
      remote: zephyrproject-rtos
      # Zephyr 4.5 development snapshot this project was verified against
      revision: 59b63417ef1b69a8ea91d2f759416c1612203b66
      import:
        # Only the modules the library and the player application need
        name-allowlist:
          - cmsis_6
          - hal_espressif
          - mbedtls
          - tf-psa-crypto
          - nanopb
          - picolibc
