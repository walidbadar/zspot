#
# West manifest: "west init -m <this repo> && west update" creates a workspace
# with Zephyr and only the modules zspot needs. The repository itself is a
# Zephyr module (zephyr/module.yml) and is picked up automatically.

manifest:
  self:
    path: zspot

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      # main after v4.5.0-rc2 (v4.5.0-rc2-76-ga915b2f1267), with the
      # ESP32 I2S fix that rc2 lacks
      revision: a915b2f12675b48b16d56653ea145dcd8f20cbbf
      import:
        # Only the modules the library and the player application need
        name-allowlist:
          - cmsis_6
          - hal_espressif
          - lvgl
          - mbedtls
          - tf-psa-crypto
          - nanopb
          - picolibc
