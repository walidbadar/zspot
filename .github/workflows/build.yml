name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ghcr.io/zephyrproject-rtos/ci:v0.29.4
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: zspot

      - name: Initialize west workspace
        working-directory: zspot
        run: |
          west init -l .
          west update -o=--depth=1 -n

      - name: Install the nanopb generator prerequisites
        run: |
          pip3 install --no-cache-dir grpcio-tools
          command -v protoc || printf '#!/bin/sh\nexec python3 -m grpc_tools.protoc "$@"\n' > /usr/local/bin/protoc
          chmod +x /usr/local/bin/protoc

      - name: Install the ALSA development package
        # native_sim plays the audio through the ALSA backend of the I2S driver
        run: |
          pkg-config --exists alsa || {
            apt-get update && apt-get install -y --no-install-recommends libasound2-dev
          }

      - name: Fetch the binary blobs of the Espressif HAL
        working-directory: zspot
        run: west blobs fetch hal_espressif

      - name: Build the player application for native_sim
        # The build as it is run and its variants (app/sample.yaml), with
        # warnings as errors
        working-directory: zspot
        run: >
          west twister -T app -v --inline-logs --integration
          -p native_sim/native/64

      - name: Build the player application for the ESP32-S3
        # Warnings allowed: at -O3 the Espressif HAL and Zephyr have some,
        # which are not this project's to fix
        working-directory: zspot
        run: >
          west twister -T app -v --inline-logs --integration
          -p uedx32480035e_wb_a/esp32s3/procpu --disable-warnings-as-errors
          -O twister-out-esp32s3

      - name: Run the unit tests
        working-directory: zspot
        run: west twister -T tests -v --inline-logs --integration
