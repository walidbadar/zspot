name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ghcr.io/zephyrproject-rtos/ci:v0.29.4
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: zspot

      - name: Initialize west workspace
        working-directory: zspot
        run: |
          west init -l .
          west update -o=--depth=1 -n

      - name: Install the nanopb generator prerequisites
        run: |
          pip3 install --no-cache-dir grpcio-tools
          command -v protoc || printf '#!/bin/sh\nexec python3 -m grpc_tools.protoc "$@"\n' > /usr/local/bin/protoc
          chmod +x /usr/local/bin/protoc

      - name: Build the player application
        working-directory: zspot
        run: west twister -T app -v --inline-logs --integration

      - name: Run the unit tests
        working-directory: zspot
        run: west twister -T tests -v --inline-logs --integration
