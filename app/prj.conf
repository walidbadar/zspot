# --- zspot ---------------------------------------------------------------
CONFIG_ZSPOT=y
CONFIG_ZSPOT_I2S_SINK=y
CONFIG_ZSPOT_LOG_LEVEL_INF=y

# --- C++ runtime for the protocol core -----------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP20=y

# --- Memory ---------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=8192
# Wi-Fi connect requests run on the system workqueue; the ESP32 driver starts
# up in the caller's context and overflows the 1 KB default.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_DYNAMIC_THREAD_POOL_SIZE=0
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y

# --- Networking -----------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=n
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="zspot"
# The TCP receive window is a third of the RX buffer space (128 bytes each).
# With 64 buffers it was 2.7 KB, less than two segments, which throttled the
# audio download; 768 buffers make it 32 KB.
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=768
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=768
CONFIG_NET_MAX_CONN=12
CONFIG_NET_MAX_CONTEXTS=12

CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096

CONFIG_ZVFS_OPEN_MAX=20
CONFIG_ZVFS_POLL_MAX=16

# DNS: resolver gets the servers from DHCP, static fallback below
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"
CONFIG_DNS_RESOLVER_MAX_SERVERS=3
# At a track change the audio CDN, the cover, the lyrics and the Web API are
# looked up at the same time; with the default of one query at a time the
# others fail at once ("DNS lookup ... failed (-3)")
CONFIG_DNS_NUM_CONCUR_QUERIES=4

# mDNS / DNS-SD for discovery by the Spotify app
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
CONFIG_MDNS_RESPONDER_DNS_SD=y

# --- TLS (Spotify endpoints: TLS 1.2, ECDHE-RSA, AES-GCM) -----------------
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# Sessions: access point resolution/metadata, audio CDN and the cover art
CONFIG_MBEDTLS_HEAP_SIZE=163840
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384=y
# The lyrics service (lrclib.net) only offers ECDSA certificates
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=6
CONFIG_ENTROPY_GENERATOR=y

# --- Display: "Now Playing" screen (LVGL) ----------------------------------
CONFIG_DISPLAY=y
CONFIG_INPUT=y
# Touch events queue up while the LVGL thread is busy (e.g. in a zspot call);
# with the default sizes drags lose events ("Could not put input data into
# queue")
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=64
CONFIG_LVGL=y
CONFIG_LV_Z_POINTER_INPUT=y
# LVGL runs on its own workqueue; the touch handlers call into zspot from it
# (protobuf encoding, socket I/O), hence the stack
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=y
CONFIG_LV_Z_LVGL_MUTEX=y
CONFIG_LV_Z_LVGL_WORKQUEUE_STACK_SIZE=16384
# Below the zspot threads (CONFIG_ZSPOT_THREAD_PRIORITY and higher): drawing
# must not take the processor from the audio decoder
CONFIG_LV_Z_LVGL_WORKQUEUE_PRIORITY=8
# Holds the widgets, the cover art (the downloaded JPEG, up to 96 KB, and the
# decoded RGB565 image, 180 KB at 300x300, briefly two of the latter), the
# Web API responses of the library view (160 KB) and the lyrics (80 KB while
# they load)
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_Z_FLUSH_THREAD_PRIORITY=8
CONFIG_LV_Z_MEM_POOL_SIZE=1048576
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_SLIDER=y
# Password entry of the Wi-Fi settings
CONFIG_LV_USE_TEXTAREA=y
CONFIG_LV_USE_BUTTONMATRIX=y
CONFIG_LV_USE_KEYBOARD=y
CONFIG_LV_THEME_DEFAULT_DARK=y
CONFIG_LV_USE_TJPGD=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
# One and a half times and twice the size, for displays larger than the
# 320x480 the UI is drawn for (the layout scales with the resolution)
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_30=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_40=y
CONFIG_LV_FONT_MONTSERRAT_48=y
CONFIG_ZSPOT_UI=y

# --- Wi-Fi (wifi_credentials library, settings/NVS backend) ----------------
# The Wi-Fi driver is selected per board; boards without Wi-Fi override this
# block (see boards/native_sim_native_64.conf).
CONFIG_WIFI=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096

# --- Speed ----------------------------------------------------------------
CONFIG_SPEED_OPTIMIZATIONS=y

# --- Logging --------------------------------------------------------------
CONFIG_NET_LOG=n
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_THREAD_NAME=n
