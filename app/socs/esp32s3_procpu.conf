# --- Speed ----------------------------------------------------------------
# Largest caches the ESP32-S3 offers: code runs from flash and every page
# buffer lives in PSRAM, both go through these caches. 64-byte data lines
# suit the renderer's sequential access to tiles and masks.
CONFIG_SOC_ESP32S3_INSTRUCTION_CACHE_32KB=y
CONFIG_SOC_ESP32S3_INSTRUCTION_CACHE_8WAYS=y
CONFIG_SOC_ESP32S3_INSTRUCTION_CACHE_LINE_32B=y
CONFIG_SOC_ESP32S3_DATA_CACHE_64KB=y
CONFIG_SOC_ESP32S3_DATA_CACHE_8WAYS=y
CONFIG_SOC_ESP32S3_DATA_CACHE_LINE_64B=y
# The modem does not sleep between beacons, which held packets back at the
# access point; the radio draws its active current all the time instead
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y
# Code and constants are copied from the flash into PSRAM at start-up (2 MB of
# the 8) and run from there: the octal PSRAM is read faster than the quad
# flash. With both set, the HAL also leaves the cache on while it writes to
# the flash, so that the rest of the system is not held up for as long as a
# sector takes to erase.
CONFIG_SOC_FAMILY_ESPRESSIF_SPIRAM_FETCH_INSTRUCTIONS=y
CONFIG_SOC_FAMILY_ESPRESSIF_SPIRAM_RODATA=y
# Octal PSRAM and flash at 80 MHz, flash in quad I/O mode
CONFIG_SOC_FAMILY_ESPRESSIF_SPIRAM_SPEED_80M=y
CONFIG_SOC_FAMILY_ESPRESSIF_FLASH_FREQ_80M=y
CONFIG_SOC_FAMILY_ESPRESSIF_FLASH_MODE_QIO=y
# -O3 on top of CONFIG_SPEED_OPTIMIZATIONS (prj.conf); flash has room
CONFIG_COMPILER_OPT="-O3"

# 8 MB octal PSRAM (enabled by the board); keep Wi-Fi and net buffers there too
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y

CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=16
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=16

# libc heap in internal RAM (nanopb and small objects; large buffers use PSRAM)
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=40960
# The .bss of the socket layer goes to PSRAM: 17 KB, nearly all of it the TLS
# socket contexts (CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS)
CONFIG_SOC_FAMILY_ESPRESSIF_SPIRAM_BSS_RELOC_LIBS_AND_OBJS="libsubsys__net.a"

# The Mbed TLS heap is relocated to PSRAM (ZSPOT_EXTERNAL_TLS_HEAP_SIZE); keep the static one small
CONFIG_MBEDTLS_HEAP_SIZE=4096
# Audio, cover, lyrics and Web API sessions overlap at a track change; the
# default of 96 KB ran out ("TLS handshake error: -0x8d")
CONFIG_ZSPOT_EXTERNAL_TLS_HEAP_SIZE=262144

# I2S slab: 6 blocks of 4 KB
CONFIG_ZSPOT_I2S_BLOCK_COUNT=6
