# The decoder works on a stack and buffers in PSRAM, so its speed depends on
# the PSRAM clock: 80 MHz instead of the default 40 MHz
CONFIG_SPIRAM_SPEED_80M=y

# 8 MB octal PSRAM (enabled by the board); keep Wi-Fi and net buffers there too
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y

CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=16
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=16

# libc heap in internal RAM (nanopb and small objects; large buffers use PSRAM)
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=40960

# Now Playing screen: the LVGL memory pool, which also serves the UI's own
# buffers and the stacks of its threads, lives in PSRAM (the SoC linker script
# places the .lvgl_heap section there).
#
# The render buffer stays in internal RAM (30 KB): the display's SPI driver
# sends it with DMA, which cannot read from PSRAM. From there the driver has
# to copy every 4 KB chunk into a buffer from the kernel heap, and fails with
# "Error allocating temp buffer Tx" when that heap is short. For the same
# reason the .bss of the LVGL library, which holds that buffer, is not
# relocated to PSRAM.
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y

# The Mbed TLS heap is relocated to PSRAM (ZSPOT_EXTERNAL_TLS_HEAP_SIZE); keep the static one small
CONFIG_MBEDTLS_HEAP_SIZE=4096
# Audio, cover, lyrics and Web API sessions overlap at a track change; the
# default of 96 KB ran out ("TLS handshake error: -0x8d")
CONFIG_ZSPOT_EXTERNAL_TLS_HEAP_SIZE=262144

# I2S slab: 6 blocks of 4 KB
CONFIG_ZSPOT_I2S_BLOCK_COUNT=6
