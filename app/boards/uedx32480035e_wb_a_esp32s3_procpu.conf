#
# UEDX32480035E-WB-A: 3.5" 320x480 touch display (ST7796S over SPI), used in
# landscape. What LVGL needs for this display; the rest of its configuration
# is in prj.conf, and what the board needs of the SoC in
# socs/esp32s3_procpu.conf.

# The LVGL memory pool, which also serves the UI's own buffers and the stacks
# of its threads, lives in PSRAM (the SoC linker script places the .lvgl_heap
# section there).
#
# The render buffer stays in internal RAM (30 KB): the display's SPI driver
# sends it with DMA, which cannot read from PSRAM. From there the driver has
# to copy every 4 KB chunk into a buffer from the kernel heap, and fails with
# "Error allocating temp buffer Tx" when that heap is short. For the same
# reason the .bss of the LVGL library, which holds that buffer, is not
# relocated to PSRAM.
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y

# The panel is drawn in RGB565. The symbols are A8, a cover that is scaled
# passes through RGB565A8, and what is shown dimmed through ARGB8888; the
# renderer does without the other colour formats.
CONFIG_LV_DRAW_SW_SUPPORT_RGB888=n
CONFIG_LV_DRAW_SW_SUPPORT_XRGB8888=n
CONFIG_LV_DRAW_SW_SUPPORT_ARGB8888_PREMULTIPLIED=n
CONFIG_LV_DRAW_SW_SUPPORT_L8=n
CONFIG_LV_DRAW_SW_SUPPORT_AL88=n
CONFIG_LV_DRAW_SW_SUPPORT_I1=n
