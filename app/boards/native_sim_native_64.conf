# native_sim/native/64: Zephyr IP stack over the host TAP interface (zeth). Create it
# on the host first with net-tools: sudo tools/net-tools/net-setup.sh
# Zephyr uses 192.0.2.1, the host side is 192.0.2.2 (gateway and NAT).

CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_NATIVE_TAP=y
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.2"

# No Wi-Fi and no flash-backed settings: override the generic Wi-Fi block
CONFIG_WIFI=n
CONFIG_WIFI_CREDENTIALS=n
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=n
CONFIG_SETTINGS=n
CONFIG_NVS=n
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n

# No I2S: decoded PCM is played on the host with aplay (alsa-utils). To write
# it to a file instead, clear the command and set CONFIG_ZSPOT_PCM_FILE.
CONFIG_ZSPOT_I2S_SINK=n
CONFIG_ZSPOT_PCM_COMMAND="aplay -q -f S16_LE -r 44100 -c 2"

# The SDL display (an on-screen window, the mouse acts as the touch screen) is
# ARGB8888
CONFIG_LV_COLOR_DEPTH_32=y

# Protocol thread stacks are heap allocated; host RAM is plentiful
CONFIG_HEAP_MEM_POOL_SIZE=262144

CONFIG_ENTROPY_GENERATOR=y
CONFIG_FAKE_ENTROPY_NATIVE_SIM=y

# Logs straight to stdout
CONFIG_LOG_BACKEND_NATIVE_POSIX=y
