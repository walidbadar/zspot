#
# The log on the console, which the player is built without. Add it with
#
#   west build -b <board> zspot/app -- -DEXTRA_CONF_FILE=debug.conf
#
# It costs processor time and memory: not for listening.

CONFIG_LOG=y
CONFIG_ZSPOT_LOG_LEVEL_INF=y
# A fault names the thread and where its stack ran out
CONFIG_THREAD_NAME=y
CONFIG_STACK_SENTINEL=y
